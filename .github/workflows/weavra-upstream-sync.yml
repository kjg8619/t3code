name: Weavra Upstream Sync

on:
  schedule:
    # 07:30 KST (22:30 UTC, previous day)
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weavra-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync upstream -> main -> devlop
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch fork and upstream
        run: |
          git remote add upstream https://github.com/pingdotgg/t3code.git
          git fetch --prune origin main devlop
          git fetch --prune upstream main

      - name: Sync upstream into main
        run: |
          git switch -C main origin/main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "main already contains upstream/main."
          else
            if ! git merge --no-edit upstream/main -m "chore(sync): merge upstream main"; then
              git merge --abort || true
              echo "::error::Conflict while merging pingdotgg/t3code main into fork main."
              exit 1
            fi
          fi

          git push origin main

      - name: Merge main into devlop
        id: merge_devlop
        run: |
          MAIN_SHA="$(git rev-parse main)"
          git switch -C devlop origin/devlop

          if git merge-base --is-ancestor "$MAIN_SHA" HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "devlop already contains current main."
            exit 0
          fi

          if ! git merge --no-ff --no-edit "$MAIN_SHA" -m "chore(sync): merge main into devlop"; then
            git merge --abort || true
            echo "::error::Conflict while merging fork main into devlop. devlop was not pushed."
            exit 1
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Setup Vite+
        if: steps.merge_devlop.outputs.changed == 'true'
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Install Linux build dependencies
        if: steps.merge_devlop.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Ensure Electron runtime is installed
        if: steps.merge_devlop.outputs.changed == 'true'
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Check unused code
        if: steps.merge_devlop.outputs.changed == 'true'
        run: vp run knip:check

      - name: Check
        if: steps.merge_devlop.outputs.changed == 'true'
        run: vp check

      - name: Typecheck
        if: steps.merge_devlop.outputs.changed == 'true'
        run: vpr typecheck

      - name: Build desktop pipeline
        if: steps.merge_devlop.outputs.changed == 'true'
        run: vp run build:desktop

      - name: Verify preload bundle
        if: steps.merge_devlop.outputs.changed == 'true'
        run: node apps/desktop/scripts/verify-preload-bundle.mjs

      - name: Test non-server workspaces
        if: steps.merge_devlop.outputs.changed == 'true'
        run: vp run --parallel --concurrency-limit 4 --filter '!t3' --filter '!@t3tools/monorepo' test

      - name: Test server
        if: steps.merge_devlop.outputs.changed == 'true'
        run: vp run --filter t3 test

      - name: Push validated devlop
        if: steps.merge_devlop.outputs.changed == 'true'
        run: |
          # Deliberately avoid force-push. If devlop changed while validation was
          # running, this push fails and preserves the newer developer work.
          git push origin HEAD:devlop

      - name: Write success summary
        if: success()
        run: |
          {
            echo "## Weavra upstream sync"
            echo
            echo "- Upstream: `pingdotgg/t3code:main`"
            echo "- Fork main: `${{ github.repository }}:main`"
            echo "- Development branch: `devlop`"
            echo "- devlop changed: `${{ steps.merge_devlop.outputs.changed || 'false' }}`"
            echo "- Result: success"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write failure summary
        if: failure()
        run: |
          {
            echo "## Weavra upstream sync failed"
            echo
            echo "No force-push was used. If the failure happened during the devlop merge or validation, the remote devlop branch was left untouched."
            echo
            echo "Review this run and resolve conflicts/tests manually before retrying."
          } >> "$GITHUB_STEP_SUMMARY"
